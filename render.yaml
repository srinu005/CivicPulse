services:
  - type: web
    name: civicpulse-backend
    runtime: python
    rootDir: backend
    plan: free
    # Render's FREE tier has no Shell access and does not support preDeployCommand,
    # so migrations + superuser creation run here, in the build step, instead.
    # Both are safe to run on every single deploy: `migrate` only applies new
    # migrations (no-op if none), and create_superuser_if_not_exists checks
    # first and skips if that username already exists.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_superuser_if_not_exists"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a strong random secret for you
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: civicpulse-backend-6wo2.onrender.com   # your actual assigned Render hostname
      - key: DATABASE_URL
        sync: false                  # paste your Neon connection string manually in the dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # paste your Netlify/Vercel frontend URL manually
      - key: FRONTEND_URL
        sync: false                  # same frontend URL, used inside notification emails
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend   # switch to smtp.EmailBackend + Gmail vars for real email
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false                  # pick your own admin username
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false                  # your real email, for password-reset purposes later
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false                  # pick a strong password -- this logs into /admin/ and provisions officers